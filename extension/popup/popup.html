<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AMZ Leads Radar</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="brand">
        <span class="logo">🎯</span>
        <div>
          <div class="brand-title">AMZ Leads Radar</div>
          <div class="brand-sub" data-i18n="brandSub">Off-Amazon growth Copilot</div>
        </div>
      </div>
      <span class="status-badge" data-i18n="running">🟢 Running</span>
    </div>

    <!-- User & Quota Card -->
    <div class="quota-card">
      <div class="user-info">
        <span class="plan-tag" id="plan-tag" data-i18n="freePlan">Free plan</span>
        <span class="user-email" id="user-email">seller@amazonbrand.com</span>
      </div>
      <div class="quota-progress-box">
        <div class="quota-label">
          <span data-i18n="dailyQuota">Daily assisted-fill quota</span>
          <span class="quota-count" id="quota-count">3 / 3 次</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width: 100%;"></div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="action-section">
      <button class="btn-primary" id="btn-open-dashboard">
        <span data-i18n="openDashboard">🚀 Open Web Dashboard</span>
      </button>

      <button class="btn-secondary" id="btn-upgrade">
        <span data-i18n="upgrade">👑 Upgrade to Pro (Unlimited)</span>
      </button>
    </div>

    <!-- Reddit Status Notice -->
    <div class="info-tip">
      💡 <strong data-i18n="howTo">How it works:</strong> Open a lead from the Web Dashboard or browse a Reddit post; the AI assistant appears on the right.
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <span>AMZ Leads Radar v1.0.0</span>
      <select id="locale-select" aria-label="Language">
        <option value="en">English</option><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="ms">Bahasa Melayu</option><option value="id">Bahasa Indonesia</option><option value="vi">Tiếng Việt</option>
      </select>
      <a href="#" id="link-options">設定</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
